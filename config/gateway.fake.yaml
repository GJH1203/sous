# Two fake upstreams in place of the local models, to try the gateway without
# a GPU:
#   go run ./cmd/fakeupstream -addr 127.0.0.1:9001 -name fake-a
#   go run ./cmd/fakeupstream -addr 127.0.0.1:9002 -name fake-b
listen: 127.0.0.1:8080
shutdown_grace: 10s

upstreams:
  - name: fake-a
    base_url: http://127.0.0.1:9001
    max_concurrent: 4
  - name: fake-b
    base_url: http://127.0.0.1:9002
    max_concurrent: 4

# The same timeouts as the real models, so that a slow fake (-delay,
# -prompt-delay, -chunk-interval) runs into them as a slow model would.
models:
  extract:
    upstream: fake-b
    model: fake-extract
    timeouts: {connect: 3s, first_byte: 8s, idle: 10s, total: 30s}
  chat:
    upstream: fake-b
    model: fake-chat
    timeouts: {connect: 3s, first_byte: 60s, idle: 15s, total: 180s}
  embed:
    upstream: fake-a
    model: fake-embed
    timeouts: {connect: 3s, first_byte: 5s, idle: 5s, total: 15s}

callers:
  - name: app
    api_key_env: SOUS_APP_KEY
    rate_limit: {burst: 20, per_second: 1}
